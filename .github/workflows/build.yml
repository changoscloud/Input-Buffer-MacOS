name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest
        - name: macOS
          os: macos-latest

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      # Geode's bindings repo is currently broken for GD 2.2081 on macOS
      # (SequenceTriggerState is never #included). Use a fixed commit and
      # add the one missing "depends" tag ourselves.
      - name: Get bindings
        uses: actions/checkout@v4
        with:
          repository: geode-sdk/bindings
          ref: 5b5f10628efa307ce65a96abe974b746b449341b
          path: bindings-pinned

      - name: Patch bindings
        shell: bash
        run: |
          perl -0pi -e 's/\[\[link\(android\)\]\](\r?\nclass SequenceTriggerGameObject )/[[link(android), depends(SequenceTriggerState)]]$1/' bindings-pinned/bindings/2.2081/GeometryDash.bro
          grep -n "depends(SequenceTriggerState)\]\]" bindings-pinned/bindings/2.2081/GeometryDash.bro

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        env:
          GEODE_BINDINGS_REPO_PATH: ${{ github.workspace }}/bindings-pinned
        with:
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
